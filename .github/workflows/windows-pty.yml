name: Windows PTY

on:
  pull_request:
  push:
    branches: [main]

jobs:
  conpty:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run debug:test:windows-pty
        env:
          REXEC_REQUIRE_WINDOWS_PTY: "1"
      - run: npm run check
