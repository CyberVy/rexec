[workspace]

[package]
name = "rexec-ios"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Build an unsigned Rexec iOS IPA, sign it with an Apple ID via isideload, and install it on a connected device without opening Xcode GUI"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
idevice = { version = "0.1.61", default-features = false, features = ["usbmuxd", "ring"] }
isideload = { version = "0.5.2", default-features = false, features = ["install", "fs-storage", "tokio-mt"] }
plist = "1.8"
rootcause = "0.12"
rpassword = "7.4"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "net"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = "0.3"
