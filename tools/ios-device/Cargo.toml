[workspace]

[package]
name = "rexec-ios"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Sign an unsigned rexec iOS build with an Apple ID and install it from the terminal"

# Signing, provisioning, and installation are provided by the MIT-licensed
# isideload crate: https://github.com/nab138/isideload
[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
idevice = { version = "0.1.61", default-features = false, features = ["usbmuxd", "ring"] }
isideload = { version = "0.5.2", default-features = false, features = ["install", "fs-storage", "tokio-mt"] }
plist = "1.8"
rootcause = "0.12"
rpassword = "7.4"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
